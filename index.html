<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bocado</title>
<meta name="description" content="Contador de calorías, macros y agua / Calorie, macro and water tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bocado">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECEEE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E100F" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: una sola columna de teléfono (máx. 480px); cifras grandes en Archivo condensada, texto en Geist, etiquetas en Geist Mono. */
:root{
  --bg:#ECEEE9;
  --surface:#FFFFFF;
  --ink:#131512;
  --muted:#686E66;
  --line:#D8DBD3;
  --accent:#2C43F5;
  --accent-ink:#FFFFFF;
  --pro:#E0484E;
  --carb:#D9970F;
  --fat:#8A57D6;
  --water:#1796BF;
  --soft:#F5F6F2;
  --display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --body:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E100F; --surface:#171A18; --ink:#ECEEE8; --muted:#90968E; --line:#2A2E2B;
    --accent:#7F8DFF; --accent-ink:#0E100F; --pro:#F2686D; --carb:#EDB13A; --fat:#AE85F0; --water:#3DB6DD; --soft:#1E2220;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E100F; --surface:#171A18; --ink:#ECEEE8; --muted:#90968E; --line:#2A2E2B;
  --accent:#7F8DFF; --accent-ink:#0E100F; --pro:#F2686D; --carb:#EDB13A; --fat:#AE85F0; --water:#3DB6DD; --soft:#1E2220;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px)}
.num{font-family:var(--display);font-variation-settings:"wdth" 64;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* Cabecera */
.top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin-bottom:12px}
.top h1{margin:0;font-family:var(--display);font-variation-settings:"wdth" 80;font-weight:700;font-size:22px;text-align:center;text-transform:capitalize}
.top .label{text-align:center;display:block}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:18px;height:18px}

/* Hero de calorías */
.hero{padding:18px 16px 16px}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big .num{font-size:76px;line-height:.86}
.big small{font-size:14px;color:var(--muted)}
.big .goal{font-size:34px;line-height:1;color:var(--muted);font-weight:700}
.big.over .num:first-child{color:var(--pro)}
.track{height:10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);overflow:hidden;position:relative}
.track > i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:99px;transition:width .35s ease}
.kline{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:12px 0 8px}
.kline b{color:var(--ink);font-weight:600}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.macro .num{font-size:26px;line-height:1}
.macro .of{font-size:12px;color:var(--muted)}
.macro .track{height:6px;margin-top:6px}
.macro .label{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Agua */
.glasses{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.glass{width:30px;height:38px;border:1.5px solid var(--water);border-radius:4px 4px 9px 9px;background:transparent;padding:0;position:relative;overflow:hidden}
.glass::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:var(--water);transition:height .25s ease}
.glass.on::after{height:78%}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:none;border:0;padding:4px 0}
.sw{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .2s}
.toggle[aria-pressed="true"] .sw{background:var(--water)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(14px)}
.pm{display:flex;gap:6px}
.pm button{width:34px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--soft);font-weight:600}

/* Comidas */
.meals{display:flex;flex-direction:column;gap:10px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px}
.mealhead{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.meal.none .mealhead h3{color:var(--muted);font-weight:500}
.mrows{border-top:1px solid var(--line);padding:2px 0}
.mrows .entry + .entry{border-top:1px dashed var(--line);border-radius:0}
.mealhead h3{margin:0;font-size:15px;font-weight:600}
.mealhead .k{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:8px}
.addmini{border:1px solid var(--line);background:var(--soft);border-radius:10px;height:30px;padding:0 10px;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.entry{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:10px 0;border-radius:10px}
.entry .nm{font-weight:500;overflow-wrap:anywhere}
.entry .sub{font-size:12px;color:var(--muted);font-family:var(--mono)}
.entry .kc{margin-left:auto;font-family:var(--display);font-variation-settings:"wdth" 70;font-weight:700;font-size:20px;white-space:nowrap}
.empty{font-size:13px;color:var(--muted);padding:0 0 10px}

/* Barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:20}
.nav .in{max-width:448px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px}
.tab{background:none;border:0;height:48px;border-radius:16px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.tab[aria-current="page"]{color:var(--ink);background:var(--soft)}
.tab svg{width:18px;height:18px}
.fab{height:52px;padding:0 22px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;display:flex;align-items:center;gap:8px;font-size:15px}
.fab svg{width:18px;height:18px}

/* Hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(10,12,10,.45);z-index:40;animation:fade .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:88vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 20px);animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet .in{max-width:448px;margin:0 auto}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:var(--display);font-variation-settings:"wdth" 80;font-weight:700;font-size:24px;margin:0 0 4px;text-wrap:balance}
.sheet p{margin:0}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:16px;padding:14px;min-height:104px;font-weight:600;cursor:pointer}
.opt svg{width:22px;height:22px}
.opt small{font-weight:400;color:var(--muted);font-size:12px;line-height:1.3}
.opt.wide{grid-column:1 / -1;min-height:auto;flex-direction:row;align-items:center}
.opt.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.primary small{color:inherit;opacity:.8}
.opt[aria-disabled="true"]{opacity:.45;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input,select.input,textarea.input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--soft);padding:0 12px;font-size:16px}
textarea.input{height:110px;padding:10px 12px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{height:50px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;width:100%;font-size:15px}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--pro);border:1px solid var(--line)}
.result{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px}
.result .num{font-size:28px;line-height:1}
.result .label{font-size:10px}
.tbl{display:grid;grid-template-columns:1.5fr repeat(4,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-variant-numeric:tabular-nums}
.tbl > div{padding:9px 8px;font-size:13px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.tbl > .h{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-top:0;background:var(--soft)}
.tbl > .rl{text-align:left;color:var(--muted)}
.tbl > .you{background:color-mix(in srgb,var(--accent) 12%,var(--surface));font-weight:700;color:var(--ink);font-size:15px}
.tbl > .you.rl{font-size:13px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.hday{margin-top:14px}
.hhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:8px 0 6px;border-bottom:1.5px solid var(--ink);font-weight:600;font-size:15px}
.hhead small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.hhead .k{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.hmeal{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 0 0}
.hmore{color:var(--accent);font-weight:600;font-size:14px;border-bottom:0}
.hmore .k svg{width:16px;height:16px;color:var(--accent)}
.li .k{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:rot 0.9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.aiitem{display:grid;grid-template-columns:auto 1fr 84px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.aiitem input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.aiitem .input{height:40px;text-align:right}
.note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:calc(100% - 32px);animation:fade .2s ease}

/* Yo */
.me{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:stretch}
.avatar{background:var(--soft);border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;padding:8px}
.avatar svg{width:100%;height:auto;max-height:250px}
.stats{margin:0;display:flex;flex-direction:column;gap:0}
.stats > div{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.stats > div:last-child{border-bottom:0}
.stats dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:0;font-family:var(--display);font-variation-settings:"wdth" 70;font-weight:700;font-size:21px;font-variant-numeric:tabular-nums}
.stats dd small{font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted);margin-left:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;height:46px}
.seg button{border:0;background:none;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px;position:relative;margin-top:10px}
.bars .b{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--ink);min-height:3px}
.bars .b.today i{background:var(--accent)}
.bars .b span{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase}
.bars .b.sel span{color:var(--ink);font-weight:700}
.bars.picked .b:not(.sel) i{opacity:.4}
.dsel{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;margin-top:8px}
.dsel:empty{display:none}
.dsel .num{font-family:var(--display);font-variation-settings:"wdth" 70;font-weight:800;font-size:26px}
.dsel small{display:block;font-size:12px;color:var(--muted)}
.dgo{border:1px solid var(--line);background:var(--soft);border-radius:10px;height:30px;padding:0 10px;font-size:13px;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0;margin-top:10px;text-align:center}
.cal .ch{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;padding-bottom:4px}
.cal .cd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:40px;background:none;border:0;border-radius:10px;padding:0;color:var(--ink);font-size:13px}
.cal .cd b{font-weight:500;font-variant-numeric:tabular-nums}
.cal .cd i{width:5px;height:5px;border-radius:50%;background:transparent}
.cal .cd.wk i{background:var(--ink)}
.cal .cd.wk.none i{background:transparent;box-shadow:inset 0 0 0 1.2px var(--muted)}
.cal .cd.today b{color:var(--accent);font-weight:800}
.cal .cd.today i{background:var(--accent);box-shadow:none}
.cal .cd.fut{color:var(--muted);opacity:.5}
.cal .cd.sel{background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.calkey{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.calkey span{display:inline-flex;align-items:center;gap:5px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.dot.acc{background:var(--accent)}
.dot.hollow{background:transparent;box-shadow:inset 0 0 0 1.2px var(--muted)}
.pm button:disabled{opacity:.35}
.goal-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6}
.foot{font-size:12px;color:var(--muted);line-height:1.5;margin:4px 2px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:360px){.big .num{font-size:62px}.me{grid-template-columns:104px 1fr}}

html,body{overscroll-behavior-y:none}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{touch-action:manipulation}
body{user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
.scanner{position:fixed;inset:0;background:#000;z-index:80;overflow:hidden}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanframe{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(84vw,420px);aspect-ratio:2.1/1;border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.scanframe::before{content:"";position:absolute;inset:0;border:2.5px solid #fff;border-radius:18px}
.scanframe::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:#ff4d4f;box-shadow:0 0 12px #ff4d4f;animation:sweep 1.6s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateY(-34px)}to{transform:translateY(34px)}}
.scanmsg{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 28px);text-align:center;color:#fff;font-weight:600;font-size:16px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.scanbar{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 24px);display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:448px;margin:0 auto}
.scanbar button,.scanbar label{height:52px;border-radius:16px;border:0;font-weight:700;font-size:15px;display:grid;place-items:center;cursor:pointer}
.scanbar .a{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.scanbar .b{background:#fff;color:#111}
.scanbar .c{grid-column:1/-1;background:none;color:#fff;height:36px;font-weight:500;font-size:14px;text-decoration:underline}

.onb{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 16px)}
.onb-in{max-width:448px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.onb-top{display:grid;grid-template-columns:40px 1fr minmax(40px,auto);align-items:center;gap:12px;height:44px}
.onb-prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.onb-prog i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s ease}
.onb-body{flex:1;padding:26px 0 18px;display:flex;flex-direction:column;gap:12px}
.onb h2{font-family:var(--display);font-variation-settings:"wdth" 78;font-weight:800;font-size:32px;line-height:1.05;margin:0;text-wrap:balance}
.onb .sub{color:var(--muted);margin:0;font-size:15px}
.onb-foot{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.onb-hero{display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 0 4px;margin-bottom:8px}
.onb-hero svg{height:220px;width:auto}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;width:100%;color:var(--ink)}
.choice small{font-weight:400;color:var(--muted);font-size:13px;line-height:1.35}
.choice[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.choice[aria-pressed="true"] small{color:inherit;opacity:.78}
.tag{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:2px 8px;margin-left:8px;vertical-align:2px;font-weight:500}
.stepper{display:grid;grid-template-columns:60px 1fr 60px;align-items:center;gap:10px;margin-top:26px}
.stepper button{height:60px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:28px;font-weight:600;color:var(--ink)}
.stepper input{border:0;background:none;text-align:center;font-family:var(--display);font-variation-settings:"wdth" 64;font-weight:800;font-size:88px;line-height:1;width:100%;padding:0;color:var(--ink);-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{outline:none}
.unitline{text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.live{text-align:center;color:var(--muted);margin:14px 0 0;min-height:1.4em;font-weight:500}
.live.bad{color:var(--pro)}
.calcline{display:flex;gap:10px;align-items:center;font-size:16px;opacity:.25;transform:translateY(4px);transition:opacity .35s ease,transform .35s ease}
.calcline.on{opacity:1;transform:none}
.planbig{display:flex;align-items:baseline;gap:10px;margin:2px 0 8px}
.planbig .num{font-size:84px;line-height:.9}
.planbig small{color:var(--muted);font-size:15px}
.avpair{display:grid;grid-template-columns:1fr 26px 1fr;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 8px 6px;margin:8px 0}
.avpair svg{width:100%;height:auto;max-height:200px}
.aig{display:flex;align-items:center;gap:4px}.aig .input{height:40px;text-align:right;width:70px;padding:0 8px}.aig span{color:var(--muted);font-size:13px}
.aiitem{grid-template-columns:auto 1fr auto}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px;padding:14px 0 4px;text-align:left;width:100%}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:14px 0 2px;font-size:15px;font-weight:500;color:var(--ink);text-align:left}
.setrow small{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.setrow .muted{font-size:14px;font-weight:400}
.langbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;height:32px;padding:0 12px;font-size:13px;font-weight:600;color:var(--ink)}
.ftin{text-align:center;font-family:var(--display);font-variation-settings:"wdth" 64;font-weight:800;font-size:76px;line-height:1;color:var(--ink)}
.catchips{flex-wrap:nowrap;overflow-x:auto;margin:12px -16px 0;padding:0 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.catchips::-webkit-scrollbar{display:none}
.catchips .chip{white-space:nowrap;flex:none}
.hchips{margin-top:0;gap:6px}
.hchips .chip{padding:6px 10px}
.tbl > .rl.you{white-space:normal;line-height:1.25}
.qstep{margin-top:4px}
.unitline.small{font-size:12px;margin-top:-2px}
.uin{width:60px;height:30px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:center;font:inherit;font-size:15px;color:var(--ink);letter-spacing:0;margin:0 2px;-moz-appearance:textfield;appearance:textfield}
.uin::-webkit-inner-spin-button,.uin::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.uin.need{border-color:var(--carb)}
.qstep input{font-size:64px}
</style>
</head>
<body>
<div class="app">
  <main id="viewHoy"></main>
  <main id="viewYo" hidden></main>
</div>

<nav class="nav" aria-label="Secciones" data-i18n-aria="Secciones|Sections">
  <div class="in">
    <button class="tab" data-act="tab" data-tab="hoy" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg><span data-i18n="Hoy|Today">Hoy</span></button>
    <button class="fab" data-act="add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="Añadir|Add">Añadir</span></button>
    <button class="tab" data-act="tab" data-tab="yo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span data-i18n="Yo|Profile">Yo</span></button>
  </div>
</nav>

<input type="file" id="fBarcode" accept="image/*" capture="environment" class="sr" tabindex="-1" aria-label="Foto del código de barras" data-i18n-aria="Foto del código de barras|Barcode photo">
<input type="file" id="fPlate" accept="image/*" capture="environment" class="sr" tabindex="-1" aria-label="Foto del plato" data-i18n-aria="Foto del plato|Meal photo">
<input type="file" id="fLabel" accept="image/*" capture="environment" class="sr" tabindex="-1" aria-label="Foto de la tabla nutricional" data-i18n-aria="Foto de la tabla nutricional|Nutrition label photo">
<input type="file" id="fImport" accept=".json,application/json,text/plain" class="sr" tabindex="-1" aria-label="Archivo de respaldo" data-i18n-aria="Archivo de respaldo|Backup file">

<div id="scanner" class="scanner" hidden role="dialog" aria-label="Escáner de código de barras" data-i18n-aria="Escáner de código de barras|Barcode scanner">
  <video id="scanVideo" playsinline muted autoplay></video>
  <div class="scanframe" aria-hidden="true"></div>
  <p class="scanmsg" id="scanMsg" data-i18n="Apunta al código de barras|Point at the barcode">Apunta al código de barras</p>
  <div class="scanbar">
    <button class="a" data-act="scanType" data-i18n="Escribir número|Type number">Escribir número</button>
    <button class="b" data-act="scanStop" data-i18n="Cerrar|Close">Cerrar</button>
    <label for="fBarcode" class="c" data-act="scanStop" data-i18n="Usar una foto en vez de la cámara|Use a photo instead of the camera">Usar una foto en vez de la cámara</label>
  </div>
</div>

<div id="onb" class="onb" hidden role="dialog" aria-modal="true" aria-label="Test inicial" data-i18n-aria="Test inicial|Setup quiz"></div>

<div id="scrim" class="scrim" hidden data-act="close"></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden><div class="in"><div class="grab"></div><div id="sheetBody"></div></div></div>

<script src="zxing.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
